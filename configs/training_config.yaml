model:
  base_model_id: "microsoft/Phi-3.5-mini-instruct"
  model_max_length: 2048
  trust_remote_code: true

lora:
  rank: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"

quantization:
  enabled: true
  bits: 4

training:
  num_epochs: 3
  batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4
  lr_scheduler: "cosine"
  warmup_ratio: 0.05
  weight_decay: 0.01
  max_grad_norm: 1.0
  seed: 42

paths:
  train_data: "data/processed/finetune_train.jsonl"
  val_data: "data/processed/finetune_val.jsonl"
  output_dir: "models/adapters"
  mlflow_tracking_uri: "experiments/mlflow"

logging:
  log_every_n_steps: 10
  eval_every_n_steps: 100
  save_every_n_steps: 200
  experiment_name: "intent-classification"
  run_name: "phi35-lora-run"
